<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex" />
<title>Tests | Recruit Score, Tier, And Confidence</title>
<style>
body { font-family: system-ui, sans-serif; margin: 24px; color: #14284b; }
h1 { font-size: 1.4rem; }
#summary { font-weight: 700; padding: 10px 14px; border: 2px solid #14284b; display: inline-block; }
#summary.pass { border-color: #1b7f3b; color: #1b7f3b; }
#summary.fail { border-color: #e41e3f; color: #e41e3f; }
li { margin: 3px 0; font-size: .9rem; }
li.ok::before { content: "PASS  "; color: #1b7f3b; font-weight: 700; }
li.bad::before { content: "FAIL  "; color: #e41e3f; font-weight: 700; }
ul { list-style: none; padding: 0; }
</style>
<script src="site-config.js"></script><script src="sports-config.js"></script></head>
<body>
<h1>Recruit Score, Tier, And Confidence Tests</h1>
<p>Runs every boundary, validation, color, label, sort, and filter test in your browser. Sample data only. Open this page and check the summary.</p>
<p id="summary" role="status">Running...</p>
<ul id="results"></ul>
<script src="classification.js"></script>
<script src="classification.tests.js"></script>
<script src="athlete-signup.js"></script>
<script src="coach.js"></script>
<script>
(function () {
  var C = window.TheReadClassification;
  var out = window.runClassificationTests(C, function (test, eq, yes) {
    var D = window.TheReadCoach;
    test('Sample data: 40+ players loaded', function () { yes(D && D.players.length >= 40, 'players'); });
    test('Sample data: every Tier and Confidence combination exists, incl. Not Rated + Unknown', function () {
      var tiers = ['Platinum', 'Gold', 'Silver', 'Bronze'], levels = ['High', 'Medium', 'Low'], miss = [];
      tiers.forEach(function (t) { levels.forEach(function (l) {
        if (!D.players.some(function (p) { return p.tier === t && p.confLevel === l; })) miss.push(t + '+' + l);
      }); });
      if (!D.players.some(function (p) { return p.tier === 'Not Rated' && p.confLevel === 'Unknown'; })) miss.push('Not Rated+Unknown');
      eq(miss.join(','), '', 'missing combos');
    });
    test('Sample data: 94.96 is Gold and displays 95.0', function () {
      var p = D.players.filter(function (x) { return x.rs === 94.96; })[0];
      yes(p, 'player'); eq(p.tier, 'Gold'); eq(C.formatRecruitScore(p.rs), '95.0');
    });
    test('Sample data: 89.96 confidence is Medium and displays 90.0%', function () {
      var p = D.players.filter(function (x) { return x.conf === 89.96; })[0];
      yes(p, 'player'); eq(p.confLevel, 'Medium'); eq(C.formatConfidencePercentage(p.conf), '90.0%');
    });
    test('Sample data: Not Rated players have no Recruit Score of 0', function () {
      D.players.forEach(function (p) { if (p.tier === 'Not Rated') yes(p.rs === null, 'rs must stay null'); });
    });
    test('Rankings row: Recruit Score, Tier, and Confidence are three separate cells', function () {
      var t = document.createElement('table'); t.innerHTML = '<tbody>' + D.rankingRowHtml(D.players[0]) + '</tbody>';
      var tr = t.querySelector('tr');
      eq(tr.querySelectorAll('td.c-rs').length, 1); eq(tr.querySelectorAll('td.c-tier').length, 1); eq(tr.querySelectorAll('td.c-conf').length, 1);
      yes(tr.querySelector('td.c-tier .rd-tier') && !tr.querySelector('td.c-tier .rd-conf'), 'tier cell holds only tier badge');
      yes(tr.querySelector('td.c-conf .rd-conf') && !tr.querySelector('td.c-conf .rd-tier'), 'conf cell holds only confidence badge');
      yes(!tr.hasAttribute('style') && !tr.querySelector('td[style], th[style]'), 'no cell or row is colored');
    });
    test('Priority Tier: from average of Coach Fit and Team Need (85 / 75 cutoffs), missing = null never 0', function () {
      eq(D.priTierFrom(90, 80), 1); eq(D.priTierFrom(85, 85), 1); eq(D.priTierFrom(80, 70), 2); eq(D.priTierFrom(75, 75), 2); eq(D.priTierFrom(74, 75), 3);
      eq(D.priTierFrom(null, 90), null); eq(D.priTierFrom(90, null), null); eq(D.priTierFrom(undefined, undefined), null);
    });
    test('Priority Tier never depends on Recruit Score, Tier or Confidence', function () { eq(D.priTierFrom(80, 80), 2); });
    test('Stage: no actions = Identified; furthest action wins', function () {
      var S = D.stageFromEntries; eq(S([]), 'Identified'); eq(S([{ act: 'added' }]), 'Identified');
      eq(S([{ act: 'added' }, { act: 'contact' }]), 'Contacted'); eq(S([{ act: 'added' }, { act: 'grade' }, { act: 'contact' }]), 'Evaluating');
      eq(S([{ act: 'added' }, { act: 'visit_sched' }]), 'Visit Planned'); eq(S([{ act: 'added' }, { act: 'visit_sched' }, { act: 'visit_done' }]), 'Visit Completed');
      eq(S([{ act: 'added' }, { act: 'visit_done' }, { act: 'offer' }, { act: 'call' }]), 'Offer Out');
    });
    test('Stage: Declined only when it is the latest action; canceled (void) actions are ignored', function () {
      var S = D.stageFromEntries; eq(S([{ act: 'added' }, { act: 'offer' }, { act: 'declined' }]), 'Declined');
      eq(S([{ act: 'added' }, { act: 'declined' }, { act: 'call' }]), 'Contacted');
      eq(S([{ act: 'added' }, { act: 'visit_sched', void: true }]), 'Identified');
    });
    test('Board rows have no manual Stage or Tier controls and Master Database has no row checkboxes', function () {
      yes(D.Board && D.Act && D.Cal, 'modules exposed');
    });
    test('ICS export: valid VCALENDAR, timed and all-day events, escapes text, [Sample] marker', function () {
      var ics = D.buildIcs([{ id: 'x1', title: 'Visit, Fictional; Day', type: 'Visit', date: '2026-11-20', start: '10:00', end: '11:30', loc: 'Field', notes: 'n', pid: '', sample: true },
        { id: 'x2', title: 'Deadline', type: 'Deadline', date: '2026-11-30', start: '', end: '', loc: '', notes: '', pid: '' }]);
      yes(/^BEGIN:VCALENDAR\r\n/.test(ics) && /END:VCALENDAR\r\n$/.test(ics), 'wrapper');
      yes(ics.indexOf('DTSTART:20261120T100000') >= 0 && ics.indexOf('DTEND:20261120T113000') >= 0, 'timed');
      yes(ics.indexOf('DTSTART;VALUE=DATE:20261130') >= 0 && ics.indexOf('DTEND;VALUE=DATE:20261201') >= 0, 'all day');
      yes(ics.indexOf('SUMMARY:[Sample] Visit\\, Fictional\\; Day') >= 0, 'escape');
    });    test('Level / Class codes: HS, JUCO, Tr plus grad year', function () {
      eq(D.lvlCode({ level: 'High School', grad: 2027 }), 'HS 2027'); eq(D.lvlCode({ level: 'JUCO', grad: 2028 }), 'JUCO 2028');
      eq(D.lvlCode({ level: '4-Year College / Transfer Portal', grad: 2029 }), 'Tr 2029'); eq(D.lvlCode({ level: 'Other', grad: 2028 }), 'Other 2028');
    });
    test('Eligibility Left: HS = N/A, entered value shown, unknown = Not Provided (never 0)', function () {
      eq(D.eligTxt({ level: 'High School', elig: null }), 'N/A'); eq(D.eligTxt({ level: 'JUCO', elig: 2 }), '2');
      eq(D.eligTxt({ level: 'JUCO', elig: null }), 'Not Provided'); eq(D.eligTxt({ level: '4-Year College / Transfer Portal', elig: '' }), 'Not Provided');
      eq(D.eligTxt({ level: 'JUCO', elig: 0 }), '0');
    });
    test('Sample JUCO/transfer players carry an entered eligibility; HS sample players do not', function () {
      var nonHs = D.players.filter(function (p) { return !p.entered && p.level !== 'High School'; });
      yes(nonHs.length > 0 && nonHs.every(function (p) { return p.elig >= 1; }), 'non-HS sample elig'); yes(D.players.filter(function (p) { return p.level === 'High School'; }).every(function (p) { return p.elig == null; }), 'HS blank');
    });    test('Role preference: text, category, missing is Not Provided', function () {
      eq(D.prefTxt({}), 'Not Provided', 'missing'); eq(D.prefCat({ pref: null }), 'Not Provided', 'cat missing');
      eq(D.prefTxt({ pref: { twoWay: 'Yes', emphasis: 'Pitcher first' } }), 'Two-Way (Pitcher first)', 'yes');
      eq(D.prefTxt({ pref: { twoWay: 'No', role: 'Position Player', pos: 'SS' } }), 'Position Player (SS)', 'no pos');
      eq(D.prefCat({ pref: { twoWay: 'No', role: 'Pitcher' } }), 'Pitcher', 'pitcher'); eq(D.prefCat({ pref: { twoWay: 'Not Sure' } }), 'Open / Not Sure', 'open');
      yes(D.players.every(function (p) { return p.rs == null || typeof p.rs === 'number'; }), 'preference does not touch scores');
    });
    test('Athlete signup: age paths and guardian gating', function () {
      var A = window.TheReadAthlete, yr = new Date().getFullYear();
      eq(A.ageOf((yr - 20) + '-01-01') >= 19, true, 'adult age'); eq(A.ageOf((yr + 1) + '-01-01'), null, 'future dob invalid');
      var base = { submitted: true, privacy: { list: true, contact: true, photo: true, metrics: true } };
      yes(A.listed(Object.assign({ path: 'adult' }, base)), 'adult listed');
      yes(!A.listed(Object.assign({ path: 'minor', guardian: { status: 'Pending', sent: Date.now(), share: {} } }, base)), 'pending minor not listed');
      yes(!A.listed(Object.assign({ path: 'minor', guardian: { status: 'Declined', sent: Date.now(), share: {} } }, base)), 'declined minor not listed');
      var v = Object.assign({ path: 'minor', guardian: { status: 'Verified', sent: Date.now(), share: { contact: false, photo: true, metrics: true } } }, base);
      yes(A.listed(v), 'verified minor listed'); yes(!A.shares(v, 'contact'), 'guardian blocks contact'); yes(A.shares(v, 'photo'), 'both allow photo');
      eq(A.gStatus({ guardian: { status: 'Pending', sent: Date.now() - 8 * 86400000 } }), 'Expired', 'expiry');
    });        test('Sample-label flag controls the hide class on <html>', function () {
      var on = !!(window.SITE_CONFIG && window.SITE_CONFIG.SHOW_SAMPLE_LABELS);
      yes(document.documentElement.classList.contains('hide-sample-labels') === !on, 'html class matches SHOW_SAMPLE_LABELS');
    });
    test('Sports config has exactly the 8 launch sports with positions; only Baseball scores', function () {
      var L = window.TheReadSports.list; eq(L.length, 8);
      eq(L.map(function (x) { return x.name; }).join('|'), 'Baseball|Men\u2019s Basketball|Women\u2019s Basketball|Football|Men\u2019s Soccer|Women\u2019s Soccer|Softball|Women\u2019s Volleyball');
      yes(L.every(function (x) { return x.positions.length > 0; }), 'positions');
      eq(L.filter(function (x) { return x.scoring; }).length, 1);
    });
    test('Rankings row: Grad Class is the 4th column after Player Name', function () {
      var t = document.createElement('table'); t.innerHTML = '<tbody>' + D.rankingRowHtml(D.players[0]) + '</tbody>';
      var cells = t.querySelectorAll('tr > *');
      yes(cells[2].classList.contains('c-name') && cells[3].classList.contains('c-grad'), 'order');
    });
  });
  var ul = document.getElementById('results');
  out.results.forEach(function (r) {
    var li = document.createElement('li'); li.className = r.ok ? 'ok' : 'bad';
    li.textContent = r.name + (r.ok ? '' : ' - ' + r.error); ul.appendChild(li);
  });
  var s = document.getElementById('summary');
  s.textContent = out.failed === 0 ? 'ALL ' + out.passed + ' TESTS PASSED' : out.failed + ' FAILED, ' + out.passed + ' passed';
  s.className = out.failed === 0 ? 'pass' : 'fail';
  document.title = s.textContent;
})();
</script>
</body>
</html>
